name: Engineering Library Consistency & Acceptance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking & Lint
        run: npm run lint

      - name: Run Acceptance & Engineering Invariant Test Suite
        run: npm run test

      - name: Build Reusable Package & Demo Application
        run: npm run build

      - name: Run Package Contract & Public API Smoke Test
        run: npm run test:contract

      - name: Run Plain <script> Build Test (three r128 & current)
        run: npm run test:script

      - name: Verify Committed Build Artifacts Are Current (lib/, standalone/)
        run: |
          # Computers without npm use the committed lib/ and standalone/ files directly.
          git status --porcelain -- lib standalone
          test -z "$(git status --porcelain -- lib standalone)"

      - name: Run Isolated Consumer Pack & Smoke Test
        run: npm run test:smoke

      - name: Verify Package Pack Integrity
        run: npm pack --dry-run
