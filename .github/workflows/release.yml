name: Release Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      dry_run:
        description: 'Dry run (do not publish to registry)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  test-and-build:
    name: Validate, Test & Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Strict Check
        run: npm run lint

      - name: Run Engineering Invariant Acceptance Suite (Case A ~ V)
        run: npm run test

      - name: Build Reusable Package Library (ESM, CJS, .d.ts)
        run: npm run build:lib

      - name: Run Package Contract & Public API Smoke Test
        run: npm run test:contract

      - name: Verify Package Packing & Artifact Integrity
        run: |
          npm pack --dry-run
          ls -la lib/
          test -f lib/index.js
          test -f lib/index.cjs
          test -f lib/index.d.ts

      - name: Build Demo Viewer Application
        run: npm run build:app

      - name: Publish to NPM
        if: ${{ !inputs.dry_run }}
        run: |
          # Publish with provenance
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: Release ${{ github.ref_name || inputs.release_tag }}
          body_path: CHANGELOG.md
          files: |
            lib/*
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
